[env:radiomaster-nomad]
extends = esp32_base
board = esp32dev
board_level = extra
board_build.partitions = partition-table.csv
board_upload.flash_size = 4MB
upload_port = COM3
monitor_port = COM3
build_flags =
  ${esp32_base.build_flags}
  -D RADIOMASTER_NOMAD
  -D HAS_SCREEN=0
  -D HAS_GPS=0
  -D HAS_WIRE=0
  -D MESHTASTIC_EXCLUDE_READOUT_TASK=1
  -I variants/esp32/radiomaster_nomad

[env:radiomaster-nomad-rf-lab]
extends = env:radiomaster-nomad
build_flags =
  ${env:radiomaster-nomad.build_flags}
  -D NOMAD_RF_LAB=1
